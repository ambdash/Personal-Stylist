# Neo4j configuration
dbms.default_database=neo4j
dbms.security.auth_enabled=true
dbms.memory.pagecache.size=512M
dbms.memory.heap.initial_size=512M
dbms.memory.heap.max_size=512M

# Network connectors
dbms.connector.bolt.enabled=true
dbms.connector.bolt.listen_address=0.0.0.0:7687
# dbms.connector.bolt.advertised_address=0.0.0.0:7687

dbms.connector.http.enabled=true
dbms.connector.http.listen_address=0.0.0.0:7474
# dbms.connector.http.advertised_address=0.0.0.0:7474

dbms.connector.http.advertised_address=localhost:7474
dbms.connector.bolt.advertised_address=localhost:7687


dbms.connector.https.enabled=false

# Transaction logs
db.tx_log.rotation.retention_policy=100M size

# CSV import configuration
dbms.security.allow_csv_import_from_file_urls=true
server.directories.import=/var/lib/neo4j/import

# Allow APOC procedures
dbms.security.procedures.unrestricted=apoc.*,algo.*

# Other settings
server.default_listen_address=0.0.0.0
