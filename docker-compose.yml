version: '3.8'

services:
  neo4j:
    build:
      context: .
      dockerfile: docker/Dockerfile.neo4j
    platform: linux/arm64
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=512M
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,algo.*
      - NEO4J_dbms_connector_bolt_advertised__address=0.0.0.0:7687
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_advertised__address=0.0.0.0:7474
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
      - NEO4J_dbms_default__database=neo4j
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - ${NEO4J_LOCAL_DATA:-neo4j_data}:/data
      - ${NEO4J_LOCAL_LOGS:-neo4j_logs}:/logs
      - ${NEO4J_LOCAL_IMPORT:-neo4j_import}:/var/lib/neo4j/import
      - ${NEO4J_LOCAL_PLUGINS:-neo4j_plugins}:/plugins
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    platform: linux/arm64
    command: >
      sh -c "redis-server
      --requirepass redis_password
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --port 6380"
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    environment:
      - TZ=UTC
      - REDIS_PORT=6380
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    platform: linux/arm64
    ports:
      - "8002:8002"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ml_models:/app/models
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=redis_password
      - PORT=8002
      - MODEL_PATH=/app/models
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 30 &&
        python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8002
      "

  # redis:
  #   image: redis:7.0-alpine
  #   platform: linux/arm64
  #   command: >
  #     sh -c "redis-server
  #     --requirepass redis_password
  #     --maxmemory 512mb
  #     --maxmemory-policy allkeys-lru
  #     --appendonly yes
  #     --port 6380"
  #   ports:
  #     - "6380:6380"
  #   volumes:
  #     - redis_data:/data
  #   environment:
  #     - TZ=UTC
  #     - REDIS_PORT=6380
  #   networks:
  #     - app-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "-p", "6380", "-a", "redis_password", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   ulimits:
  #     nofile:
  #       soft: 65536
  #       hard: 65536

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    platform: linux/arm64
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=redis_password
      - C_FORCE_ROOT=true
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 30 &&
        celery -A src.celery_app worker --loglevel=info -Q db
      "

  celery_flower:
    image: mher/flower
    platform: linux/arm64
    command: ["celery", "flower", "--broker=redis://:redis_password@redis:6380/0"]
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://:redis_password@redis:6380/0
      - FLOWER_PORT=5555
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    platform: linux/arm64
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=redis_password
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=8000
    # volumes:
    #   - ./src:/app/src
    #   - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 45 &&
        python -m src.bot.main
      "

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  ml_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/models
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
