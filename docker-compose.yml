version: '3.8'

services:
  # Redis - Message broker and result backend
  redis:
    image: redis:7-alpine
    container_name: personal_stylist_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stylist_network

  # Neo4j - Knowledge graph database
  neo4j:
    build:
      context: .
      dockerfile: docker/Dockerfile.neo4j
    container_name: personal_stylist_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./src/api/db/neo4j:/var/lib/neo4j/import/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - stylist_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: personal_stylist_api
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - PYTHONPATH=/app
      - PORT=8002
      - ENVIRONMENT=docker
    volumes:
      - ./src/ml/models/finetuned:/app/src/ml/models/finetuned:ro
      - model_cache:/app/data/models/cache
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stylist_network

  # Inference Worker - GPU-enabled for model inference
  inference_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: personal_stylist_inference_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0
      - C_FORCE_ROOT=true
      - MODEL_NAME=t-tech/T-lite-it-1.0
      - ADAPTER_PATH=src/ml/models/finetuned/t_lite
    volumes:
      - ./src/ml/models/finetuned:/app/src/ml/models/finetuned:ro
      - model_cache:/app/data/models/cache
      - /dev/shm:/dev/shm  # Shared memory for PyTorch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=info", "-Q", "inference", "--concurrency=1"]
    healthcheck:
      test: ["CMD", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@inference_worker"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stylist_network

  # Database Worker - For Neo4j operations
  db_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: personal_stylist_db_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - PYTHONPATH=/app
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=info", "-Q", "database", "--concurrency=4"]
    healthcheck:
      test: ["CMD", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@db_worker"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stylist_network

  # Telegram Bot
  telegram_bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    container_name: personal_stylist_bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - PYTHONPATH=/app
      - API_BASE_URL=http://api:8002
    depends_on:
      api:
        condition: service_healthy
      inference_worker:
        condition: service_healthy
      db_worker:
        condition: service_healthy
    networks:
      - stylist_network

  # Flower - Celery monitoring
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: personal_stylist_flower
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "src.celery_app", "flower", "--port=5555"]
    networks:
      - stylist_network

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  model_cache:

networks:
  stylist_network:
    driver: bridge
